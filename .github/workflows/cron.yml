name: Scheduled Outage Monitor Cron

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum standard schedule)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI for testing

jobs:
  check-outages:
    name: Check Outages & Dispatch Web Push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Edge Outage Monitor Endpoint
        run: |
          echo "Calling /api/push/cron..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" "https://fayna-ses-cq2.pages.dev/api/push/cron")
          echo "Response: $RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Successfully executed outage monitor check."
          else
            echo "Monitor endpoint returned status $STATUS"
            exit 1
          fi
