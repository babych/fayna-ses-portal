name: Deploy to Cloudflare Pages & Worker

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - name: Type Check & Build
        run: npm run build

      - name: Deploy to Cloudflare Pages & Provision D1
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # 1. Apply high-performance schema migrations to existing D1 database
            echo "Applying D1 schema migrations..."
            npx wrangler d1 execute fayna-ses-db-eu --remote --file=./functions/db/schema.sql || true

            # 2. Deploy Pages project
            echo "Deploying to Cloudflare Pages..."
            npx wrangler pages deploy dist --project-name=fayna-ses
          else
            echo "CLOUDFLARE_API_TOKEN is not set yet. Build verification succeeded!"
          fi
